<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者ダッシュボード｜メディアライブリー</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="header-inner">
<a class="logo" href="index.html">メディア<span>ライブリー</span></a>
<nav class="main-nav" aria-label="メインナビゲーション">
<a href="index.html">ホーム</a><a href="anime.html">アニメ</a><a href="ranking.html">ランキング</a><a href="genre.html">ジャンル</a>
</nav></div></header><main class="main admin-panel"><div class="section-heading"><h1>管理者ダッシュボード</h1><button id="logout" class="small-button">ログアウト</button></div><div id="guard" class="status">ログイン状態を確認しています……</div><div id="dashboard" class="hidden">
<section class="panel"><h2>アニメ管理</h2><form id="anime-form" class="form-grid"><input type="hidden" id="anime-id"><div class="field"><label>タイトル</label><input id="anime-title" required maxlength="200"></div><div class="field"><label>英語タイトル</label><input id="anime-english" maxlength="300"></div><div class="field full"><label>ジャンル</label><input id="anime-genre" maxlength="300" placeholder="SF, ミステリー"></div><div class="field full"><label>あらすじ</label><textarea id="anime-description" maxlength="5000"></textarea></div><div class="field full"><label>レビュー</label><textarea id="anime-review" maxlength="10000"></textarea></div><div class="field full"><label>公式サイトURL</label><input id="anime-url" type="url"></div><div class="actions"><button class="primary-button" type="submit">保存</button><button class="small-button" id="anime-cancel" type="button">入力をクリア</button></div><div id="anime-message" class="message"></div></form><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>作品</th><th>ジャンル</th><th>操作</th></tr></thead><tbody id="anime-table"></tbody></table></div></section>
<section class="panel"><h2>おすすめアニメ管理</h2><p class="description">既存の recommended_anime テーブルを管理します。期間・時刻は空欄なら制限なしです。</p><form id="rec-form" class="form-grid"><input type="hidden" id="rec-id"><div class="field"><label>アニメID</label><input id="rec-anime-id" type="number" required></div><div class="field"><label>表示順</label><input id="rec-order" type="number" value="1"></div><div class="field"><label>開始日</label><input id="rec-start-date" type="date"></div><div class="field"><label>終了日</label><input id="rec-end-date" type="date"></div><div class="field"><label>開始時刻</label><input id="rec-start-time" type="time"></div><div class="field"><label>終了時刻</label><input id="rec-end-time" type="time"></div><div class="field"><label>有効</label><select id="rec-active"><option value="true">有効</option><option value="false">無効</option></select></div><div class="actions"><button class="primary-button">保存</button><button class="small-button" id="rec-cancel" type="button">クリア</button></div><div id="rec-message" class="message"></div></form><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>アニメID</th><th>期間</th><th>順序</th><th>有効</th><th>操作</th></tr></thead><tbody id="rec-table"></tbody></table></div></section>
<section class="panel"><h2>コメント管理</h2><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>作品ID</th><th>ニックネーム</th><th>コメント</th><th>日時</th><th>操作</th></tr></thead><tbody id="comment-table"></tbody></table></div></section>
<section class="panel"><h2>広告管理</h2><form id="ad-form" class="form-grid"><input type="hidden" id="ad-id"><div class="field"><label>企業名</label><input id="ad-company"></div><div class="field"><label>タイトル</label><input id="ad-title"></div><div class="field full"><label>説明</label><textarea id="ad-description"></textarea></div><div class="field"><label>画像URL</label><input id="ad-image" type="url"></div><div class="field"><label>リンクURL</label><input id="ad-link" type="url"></div><div class="field"><label>有効</label><select id="ad-active"><option value="true">有効</option><option value="false">無効</option></select></div><div class="actions"><button class="primary-button">保存</button><button class="small-button" id="ad-cancel" type="button">クリア</button></div><div id="ad-message" class="message"></div></form><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>企業</th><th>タイトル</th><th>有効</th><th>操作</th></tr></thead><tbody id="ad-table"></tbody></table></div></section>
</div></main><footer class="footer"><div class="footer-inner">
<h2 class="footer-title">メディアライブリー</h2><p class="footer-description">アニメの情報・ランキング・レビューを紹介するメディアサイト。</p>

<a class="admin-link" href="admin.html">管理者ログイン</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/admin-dashboard.js"></script></body></html>
