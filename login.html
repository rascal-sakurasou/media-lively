<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン｜メディアライブリー</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><div class="auth-card"><a class="logo" href="index.html">メディア<span>ライブリー</span></a><h1>アカウント</h1><p>ログインして、マイリストやレビューを利用できます。</p><form id="auth-form"><label>メールアドレス<input id="email" type="email" required autocomplete="email"></label><label>パスワード<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button class="primary-button" type="submit">ログイン</button></form><button id="signup" class="secondary-button">新規登録</button><button id="logout" class="text-button hidden">ログアウト</button><div id="auth-status" class="status"></div><a href="index.html">← トップへ戻る</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/auth.js"></script></body></html>
